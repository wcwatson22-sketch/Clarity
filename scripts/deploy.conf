# ─────────────────────────────────────────────────────────────────────────────
# Clarity Finance — Deployment Configuration
#
# Fill in your values here. This is the ONLY file you need to edit before
# running server-setup.sh and deploy.sh.
#
# This file contains NO secrets (no passwords, no API keys).
# It is safe to commit after filling in your domain and server details.
# ─────────────────────────────────────────────────────────────────────────────

# Your production domain (without https://)
DOMAIN="clarityfinancialtools.com"

SERVER_IP="206.81.14.66"

# SSH user on your VPS (typically "root" for a fresh VPS)
SERVER_USER="root"

# Path to your SSH private key (default works for most setups)
SSH_KEY="$HOME/.ssh/clarity_deploy"

# Remote paths (no need to change these)
REMOTE_APP_DIR="/opt/clarity-api"
REMOTE_WEB_DIR="/var/www/clarity"
REMOTE_ENV_FILE="/etc/clarity/env"
REMOTE_BACKUP_DIR="/opt/clarity-backups"
