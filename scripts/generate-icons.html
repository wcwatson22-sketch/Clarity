<!DOCTYPE html>
<!--
  Clarity Finance — PWA Icon Generator
  ─────────────────────────────────────
  Open this file in any browser.
  Click "Download 192×192" and "Download 512×512".
  Drop both files into frontend/src/icons/.

  To customize: edit the drawIcon() function below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clarity Icon Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 24px; background: #F9FAFB; color: #111827; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p  { color: #6B7280; margin-top: 0; }
    .row { display: flex; gap: 32px; align-items: flex-start; margin: 32px 0; flex-wrap: wrap; }
    .card { background: white; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; text-align: center; }
    canvas { display: block; margin: 0 auto 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    button {
      background: #1D9E75; color: white; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      width: 100%;
    }
    button:hover { background: #17836200; background: #178362; }
    .label { font-size: 13px; color: #6B7280; margin-bottom: 12px; }
    .instructions { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 8px; padding: 16px; margin-top: 32px; font-size: 14px; line-height: 1.6; }
    code { background: #E5E7EB; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Clarity — PWA Icon Generator</h1>
  <p>Generates the two PNG icons needed for mobile "Add to Home Screen".</p>

  <div class="row">
    <div class="card">
      <div class="label">192 × 192</div>
      <canvas id="c192" width="192" height="192"></canvas>
      <button onclick="download(192)">Download icon-192x192.png</button>
    </div>
    <div class="card">
      <div class="label">512 × 512</div>
      <canvas id="c512" width="512" height="512" style="width:192px;height:192px"></canvas>
      <button onclick="download(512)">Download icon-512x512.png</button>
    </div>
  </div>

  <div class="instructions">
    <strong>After downloading:</strong><br>
    Place both files in <code>frontend/src/icons/</code><br><br>
    <strong>To customize the icon:</strong><br>
    Edit the <code>drawIcon()</code> function in this file, then refresh the page.
  </div>

  <script>
    function drawIcon(ctx, size) {
      const s = size;
      const cx = s / 2;
      const cy = s / 2;
      const r = s / 2;
      const pad = s * 0.08;

      // Background circle — brand green
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#1D9E75';
      ctx.fill();

      // Subtle inner ring for depth
      ctx.beginPath();
      ctx.arc(cx, cy, r - pad * 0.4, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = s * 0.018;
      ctx.stroke();

      // Letter "C"
      const fontSize = s * 0.52;
      ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Nudge slightly left so the "C" optical center feels right
      ctx.fillText('C', cx - s * 0.025, cy + s * 0.02);
    }

    function render(size) {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      drawIcon(ctx, size);
    }

    function download(size) {
      const canvas = document.getElementById('c' + size);
      const link = document.createElement('a');
      link.download = `icon-${size}x${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Render both on load
    render(192);
    render(512);
  </script>
</body>
</html>
