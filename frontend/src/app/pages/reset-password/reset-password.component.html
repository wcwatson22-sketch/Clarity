<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Clarity</span>
    </div>

    @if (success()) {
      <div class="success-state">
        <span class="success-icon">✅</span>
        <h2 class="auth-title">Password updated!</h2>
        <p class="auth-sub">Redirecting you to sign in…</p>
      </div>
    } @else {
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-sub">Enter a new password for your Clarity account.</p>

      @if (error()) {
        <div class="auth-error">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()" class="auth-form">
        <div class="field-group">
          <label class="field-label">New Password <span class="field-hint">(min 6 characters)</span></label>
          <input class="field-input" type="password" placeholder="New password"
            [value]="newPw()" (input)="newPw.set($any($event.target).value)" />
        </div>
        <div class="field-group">
          <label class="field-label">Confirm Password</label>
          <input class="field-input" type="password" placeholder="Repeat password"
            [value]="confirmPw()" (input)="confirmPw.set($any($event.target).value)" />
        </div>
        <button class="auth-btn" type="submit" [disabled]="loading() || !token()">
          {{ loading() ? 'Updating…' : 'Update Password' }}
        </button>
      </form>
    }

    <p class="auth-switch"><a routerLink="/login">Back to Sign In</a></p>
  </div>
</div>
