<div class="lock-screen">
  <div class="lock-content">

    <!-- Logo / Brand -->
    <div class="lock-brand">
      <img src="icons/logo.png" alt="Clarity" class="lock-logo" />
    </div>

    <!-- Authenticating spinner (Face ID prompt is shown by the OS) -->
    @if (loading()) {
      <div class="lock-loading">
        <div class="spinner"></div>
        <p class="lock-sub">Unlocking with Face ID…</p>
      </div>
    } @else {
      <!-- Manual retry if the OS prompt was dismissed without resolving -->
      <button class="biometric-btn" (click)="tryBiometric()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22">
          <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
          <path d="M9 9a3 3 0 1 1 6 0v1"/>
          <path d="M8 15s1 2 4 2 4-2 4-2"/>
          <line x1="9" y1="12" x2="9" y2="15"/>
          <line x1="15" y1="12" x2="15" y2="15"/>
        </svg>
        Unlock with Face ID
      </button>
    }

  </div>
</div>
