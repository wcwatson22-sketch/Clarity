<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clarity — Personal Finance Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Track your net worth, cash flow, and financial progress — all in one place.">
  <meta name="theme-color" content="#1D9E75">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clarity">
  <link rel="apple-touch-icon" href="icons/Icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon.png">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/Icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/Icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/Icon.png">
</head>
<script>
  // Unregister any cached service workers so hard-refresh deploys normally.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    });
  }
</script>
<body style="margin:0;background:#0a1628;">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
