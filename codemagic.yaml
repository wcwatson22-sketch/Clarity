workflows:

  # ── iOS App Store build ────────────────────────────────────────────────────
  ios-release:
    name: iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.clarityfinancialtools.app
      vars:
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        ASC_KEY_ID: 24DJNHQWAS
        ASC_ISSUER_ID: 55a91748-0078-45c8-ae86-f98d86a83c88
        # Base64-encoded App Store Connect private key (AuthKey_24DJNHQWAS.p8)
        ASC_PRIVATE_KEY_B64: 
      node: 22.13.0
      xcode: 26

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build:prod

      - name: Capacitor sync (copy web assets into iOS project)
        script: |
          cd frontend
          npx cap sync ios

      - name: Set build number
        script: |
          cd frontend/ios/App
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          # Decode the base64 private key to a file (avoids newline corruption)
          mkdir -p ~/.private_keys
          echo "$ASC_PRIVATE_KEY_B64" | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Find the built IPA
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload to TestFlight via xcrun altool
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true

  # ── Android Play Store build (future) ─────────────────────────────────────
  android-release:
    name: Android — Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - clarity_keystore
      vars:
        PACKAGE_NAME: com.clarityfinancialtools.app
      node: 20.17.0
      java: 17

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build

      - name: Capacitor sync
        script: |
          cd frontend
          npx cap sync android

      - name: Build Android release APK/AAB
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
