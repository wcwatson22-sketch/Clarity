workflows:

  # ── iOS App Store build ────────────────────────────────────────────────────
  ios-release:
    name: iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_ID: com.clarityfinancialtools.app
        BUNDLE_ID: com.clarityfinancialtools.app
        ASC_KEY_ID: 24DJNHQWAS
        ASC_ISSUER_ID: 55a91748-0078-45c8-ae86-f98d86a83c88
      node: 22.13.0
      xcode: 16.2

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build

      - name: Capacitor sync (copy web assets into iOS project)
        script: |
          cd frontend
          npx cap sync ios

      - name: Build .ipa
        script: |
          # Write API key to temp file — convert escaped \n back to real newlines
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/\\n/\n/g' > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

          # Archive — action first, build settings last
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist frontend/ios/App/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  # ── Android Play Store build (future) ─────────────────────────────────────
  android-release:
    name: Android — Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - clarity_keystore
      vars:
        PACKAGE_NAME: com.clarityfinancialtools.app
      node: 20.17.0
      java: 17

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build

      - name: Capacitor sync
        script: |
          cd frontend
          npx cap sync android

      - name: Build Android release APK/AAB
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
