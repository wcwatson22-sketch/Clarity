workflows:

  # ── iOS App Store build ────────────────────────────────────────────────────
  ios-release:
    name: iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Auto-build + upload to TestFlight on every push to main.
    # (Requires the repo's webhook to be connected in the Codemagic UI.)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.clarityfinancialtools.app
      groups:
        # Holds ASC_PRIVATE_KEY_B64 as a secure Codemagic-managed variable —
        # never hardcode this value in this file again. (Previous key
        # 24DJNHQWAS was committed here in plaintext and publicly exposed on
        # GitHub; it was revoked and replaced on 2026-07-23.) Group name is
        # case-sensitive in Codemagic — must match exactly, all uppercase.
        - ASC_PRIVATE_KEY_B64
      vars:
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        ASC_KEY_ID: 4N5HDD9RAR
        ASC_ISSUER_ID: 55a91748-0078-45c8-ae86-f98d86a83c88
      node: 22.13.0
      xcode: 26

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build:prod

      - name: Capacitor sync (copy web assets into iOS project)
        script: |
          cd frontend
          npx cap sync ios

      - name: Set build number
        script: |
          cd frontend/ios/App
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          # Diagnostic only (safe to print — it's a length, not the key itself):
          # confirms whether Codemagic is passing the variable through intact.
          # Expected length is 344 for the current key file.
          echo "ASC_PRIVATE_KEY_B64 raw length as seen by this build: ${#ASC_PRIVATE_KEY_B64}"

          # Decode the base64 private key to a file. Strip ALL whitespace first
          # (tr -d) — base64 should never contain whitespace, but a value that
          # passed through a web form's textarea can pick up a stray trailing
          # newline or other whitespace, which some base64 decoders choke on.
          # Using printf instead of echo avoids adding yet another trailing
          # newline of our own on top of whatever the variable already has.
          mkdir -p ~/.private_keys
          printf '%s' "$ASC_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Sanity-check the decoded file actually looks like a PEM key before
          # wasting a build attempting the upload with garbage — fail fast with
          # a clear message instead of Apple's cryptic altool -39 error.
          if ! grep -q "BEGIN PRIVATE KEY" ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8; then
            echo "ERROR: decoded AuthKey file does not contain a PEM private key header."
            echo "Decoded file size: $(wc -c < ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8) bytes (a valid key file is ~257 bytes)."
            echo "This means ASC_PRIVATE_KEY_B64 in Codemagic's variable group does not hold a correct value — re-check it."
            exit 1
          fi

          # Find the built IPA
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload to TestFlight via xcrun altool
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true

  # ── Android Play Store build (future) ─────────────────────────────────────
  android-release:
    name: Android — Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - clarity_keystore
      vars:
        PACKAGE_NAME: com.clarityfinancialtools.app
      node: 20.17.0
      java: 17

    scripts:
      - name: Install Node dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Angular app
        script: |
          cd frontend
          npm run build

      - name: Capacitor sync
        script: |
          cd frontend
          npx cap sync android

      - name: Build Android release APK/AAB
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - wcwatson22@gmail.com
        notify:
          success: true
          failure: true
