apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clarity-ingress
  namespace: clarity
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: clarity.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clarity-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clarity-frontend
                port:
                  number: 80
